name: Manual Retention Cleanup & Aggregation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retention-and-squash:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aggregate daily LST, clean expired frames & squash HF Git history
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_REALTIME: ${{ vars.HF_REPO_REALTIME }}
        run: |
          python -m pipeline.retention --aggregate-yesterday --squash-hf
