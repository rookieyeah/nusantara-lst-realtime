name: Trigger GitHub Pages Build

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Web Assets
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f data/manifest.json
          echo "Web assets & manifest verified for GitHub Pages."
