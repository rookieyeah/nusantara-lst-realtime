name: Himawari-9 On-Demand / Backfill LST Pipeline

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Wilayah (indonesia / kalimantan)"
        required: false
        default: "indonesia"
      time_utc:
        description: "Waktu frame UTC opsional (YYYYMMDDHHMM)"
        required: false
        default: ""
      backfill_today:
        description: "Isi otomatis seluruh siklus jam hari ini (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  process-lst:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Himawari-9 LST pipeline (Indonesia & Kalimantan)
        run: |
          if [ "${{ inputs.backfill_today }}" = "true" ]; then
            python -m pipeline.backfill --step-hours 1
          elif [ -n "${{ inputs.time_utc }}" ]; then
            python -m pipeline.run_himawari --region "${{ inputs.region || 'indonesia' }}" --time "${{ inputs.time_utc }}" --update-composites
          else
            python -m pipeline.run_himawari --region indonesia --keep-raw --update-composites
            python -m pipeline.run_himawari --region kalimantan --update-composites
          fi

      - name: Sync to Hugging Face Hub Dataset & Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_REALTIME: ${{ vars.HF_REPO_REALTIME }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            python -m pipeline.deploy --hf-token "$HF_TOKEN" --sync-only
          fi
