name: Auto-Update Near-Realtime LST (Himawari-9 + Multi-Sensor Fusion)

on:
  schedule:
    # Berjalan otomatis setiap 15 menit (24/7) pada GitHub Actions publik (100% Gratis)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      target_time_utc:
        description: "Opsional: waktu spesifik YYYYMMDDHHMM (kosongkan untuk frame terbaru)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: "lst-auto-update"
  cancel-in-progress: false

jobs:
  update-lst:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch & Process Himawari-9 LST + Update Composites (Indonesia & Kalimantan)
        env:
          TARGET_TIME: ${{ github.event.inputs.target_time_utc }}
        run: |
          if [ -n "$TARGET_TIME" ]; then
            python -m pipeline.run_himawari --region indonesia --at "$TARGET_TIME" --keep-raw --update-composites
            python -m pipeline.run_himawari --region kalimantan --at "$TARGET_TIME" --update-composites
          else
            python -m pipeline.run_himawari --region indonesia --keep-raw --update-composites
            python -m pipeline.run_himawari --region kalimantan --update-composites
          fi

      - name: Sync to Hugging Face Hub Dataset & Space (if HF_TOKEN configured)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_REALTIME: ${{ vars.HF_REPO_REALTIME }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            python -m pipeline.deploy --hf-token "$HF_TOKEN" --sync-only
          else
            echo "HF_TOKEN belum diset; lewati unggah ke Hugging Face Hub."
          fi

      - name: Commit & Push Updated LST Data to GitHub Repository (GitHub Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Himawari-9 LST $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "Tidak ada perubahan data baru."
          fi
